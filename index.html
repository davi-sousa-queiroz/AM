<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Arctic Monkeys.</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <span>ARCTIC</span>
        <span>MONKEYS</span>
      </div>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#albums">Albums</a></li>
        <li><a href="#featured">Featured</a></li>
        <li><a href="#numbers">Numbers</a></li>
      </ul>
    </nav>
    <section class="hero">
      <p class="hero-parag">THERE'D BETTER BE A</p>
      <h1>MIRRORBALL</h1>
      <div class="buttons">
        <button class="listen">LISTEN NOW</button>
        <button class="albums">EXPLORE ALBUMS</button>
      </div>
      <p class="quote">"I JUST WANT TO BE ONE OF THE STROKES"</p>
    </section>
    <section class="section-1">
      <h2 class="head">ALBUMS</h2>
      <div class="cards">
        <div class="am">
          <img class="am-img" src="static/am cover.jpg" alt="AM album cover" />
          <h3 class="am-head">AM</h3>
          <p class="am-year">2013</p>
          <p class="am-listen">LISTEN</p>
        </div>
        <div class="tranquility">
          <img
            class="tranquility-img"
            src="static/base.jpg"
            alt="Tranquility album cover"
          />
          <h3 class="tranquility-head">TRANQUILITY BASE HOTEL & CASINO</h3>
          <p class="tranquility-year">2018</p>
          <p class="tranquility-listen">LISTEN</p>
        </div>
        <div class="nightmare">
          <img
            class="nightmare-img"
            src="static/Favourite.jpg"
            alt="Nightmare album cover"
          />
          <h3 class="nightmare-head">FAVOURITE WORST NIGHTMARE</h3>
          <p class="nightmare-year">2007</p>
          <p class="nightmare-listen">LISTEN</p>
        </div>
        <div class="humbug">
          <img
            class="humbug-img"
            src="static/humbug.jpg"
            alt="Humbug album cover"
          />
          <h3 class="humbug-head">HUMBUG</h3>
          <p class="humbug-year">2009</p>
          <p class="humbug-listen">LISTEN</p>
        </div>
      </div>
    </section>
  </body>
</html>
